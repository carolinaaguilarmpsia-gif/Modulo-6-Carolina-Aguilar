<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1100" height="760" fill="#ffffff"/>

  <!-- Título -->
  <text x="550" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Arquitectura SGAI — Módulo Declaraciones Juradas</text>

  <!-- Usuario -->
  <rect x="30" y="70" width="140" height="60" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="100" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Usuario</text>
  <text x="100" y="113" text-anchor="middle" font-size="11" fill="#475569">Docente / Admin. Facultad</text>

  <!-- Cliente -->
  <rect x="30" y="180" width="140" height="80" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="100" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Cliente</text>
  <text x="100" y="225" text-anchor="middle" font-size="11" fill="#1e40af">React + Vite</text>
  <text x="100" y="240" text-anchor="middle" font-size="11" fill="#1e40af">:5173</text>

  <!-- Backend box -->
  <rect x="240" y="150" width="620" height="290" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="260" y="172" font-size="12" font-weight="bold" fill="#334155">Backend — Express + TypeScript (:3001)</text>

  <!-- 3 servicios IA -->
  <rect x="260" y="190" width="180" height="70" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/>
  <text x="350" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">Asistente Trámites</text>
  <text x="350" y="227" text-anchor="middle" font-size="10.5" fill="#166534">keyword → RAG → LLM-router</text>
  <text x="350" y="241" text-anchor="middle" font-size="10.5" fill="#166534">→ fallback</text>

  <rect x="460" y="190" width="180" height="70" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.3"/>
  <text x="550" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c1d95">Agente DJ (MCP)</text>
  <text x="550" y="227" text-anchor="middle" font-size="10.5" fill="#5b21b6">Bucle ReAct · 5 tools</text>
  <text x="550" y="241" text-anchor="middle" font-size="10.5" fill="#5b21b6">pausa + confirma escritura</text>

  <rect x="660" y="190" width="180" height="70" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="750" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350f">Orquestador</text>
  <text x="750" y="227" text-anchor="middle" font-size="10.5" fill="#92400e">clasifica → rama de negocio</text>
  <text x="750" y="241" text-anchor="middle" font-size="10.5" fill="#92400e">→ nodo</text>

  <!-- Servidor MCP in-process -->
  <rect x="460" y="278" width="180" height="55" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="550" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#4c1d95">Servidor MCP</text>
  <text x="550" y="313" text-anchor="middle" font-size="10" fill="#5b21b6">InMemoryTransport (in-process)</text>

  <!-- DJStateMachine / servicios de dominio -->
  <rect x="260" y="345" width="580" height="65" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.3"/>
  <text x="550" y="367" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Dominio — DeclaracionJuradaService · DJStateMachine · BuscarDocentePorNombre</text>
  <text x="550" y="384" text-anchor="middle" font-size="10.5" fill="#475569">RBAC, máquina de estados, sugerencias por distancia de edición — 100% código, sin IA</text>

  <!-- LLM providers -->
  <rect x="920" y="150" width="150" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="995" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">Groq (API)</text>
  <text x="995" y="191" text-anchor="middle" font-size="10.5" fill="#991b1b">openai/gpt-oss-20b</text>
  <text x="995" y="206" text-anchor="middle" font-size="10.5" fill="#991b1b">chat / tool-calling</text>

  <rect x="920" y="240" width="150" height="85" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="995" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">Ollama (local)</text>
  <text x="995" y="279" text-anchor="middle" font-size="10.5" fill="#991b1b">nomic-embed-text</text>
  <text x="995" y="293" text-anchor="middle" font-size="10.5" fill="#991b1b">(embeddings, RAG)</text>
  <text x="995" y="308" text-anchor="middle" font-size="10.5" fill="#991b1b">llama3.2:3b (rung 0)</text>

  <!-- Almacenamiento -->
  <rect x="240" y="470" width="620" height="110" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="260" y="492" font-size="12" font-weight="bold" fill="#334155">Almacenamiento</text>

  <rect x="260" y="505" width="185" height="60" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
  <text x="352" y="527" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">In-memory</text>
  <text x="352" y="543" text-anchor="middle" font-size="10" fill="#334155">Usuarios · Declaraciones</text>
  <text x="352" y="556" text-anchor="middle" font-size="10" fill="#334155">Juradas (seed en boot)</text>

  <rect x="465" y="505" width="175" height="60" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
  <text x="552" y="527" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">db.json</text>
  <text x="552" y="543" text-anchor="middle" font-size="10" fill="#334155">34 trámites DPA</text>
  <text x="552" y="556" text-anchor="middle" font-size="10" fill="#334155">(fuente del RAG)</text>

  <rect x="660" y="505" width="180" height="60" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
  <text x="750" y="527" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">conversaciones.json</text>
  <text x="750" y="543" text-anchor="middle" font-size="10" fill="#334155">Estado del orquestador —</text>
  <text x="750" y="556" text-anchor="middle" font-size="10" fill="#334155">sobrevive un reinicio</text>

  <!-- Flechas -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#334155"/>
    </marker>
  </defs>

  <line x1="100" y1="130" x2="100" y2="176" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="170" y1="220" x2="236" y2="220" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="212" text-anchor="middle" font-size="9.5" fill="#334155">HTTP/JSON</text>

  <line x1="640" y1="225" x2="916" y2="185" stroke="#b91c1c" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="750" y1="260" x2="990" y2="245" stroke="#b91c1c" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="350" y1="260" x2="990" y2="270" stroke="#b91c1c" stroke-width="1.1" stroke-dasharray="3 2" marker-end="url(#arrow)"/>

  <line x1="550" y1="260" x2="550" y2="276" stroke="#6d28d9" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="550" y1="333" x2="550" y2="343" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="350" y1="260" x2="350" y2="343" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="750" y1="260" x2="750" y2="343" stroke="#475569" stroke-width="1.1" stroke-dasharray="3 2" marker-end="url(#arrow)"/>

  <line x1="550" y1="410" x2="550" y2="468" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Leyenda -->
  <rect x="30" y="660" width="1040" height="80" rx="8" fill="#fafaf9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="45" y="680" font-size="11" font-weight="bold" fill="#1e293b">Leyenda</text>
  <text x="45" y="698" font-size="10.5" fill="#334155">→ trazo sólido: llamada síncrona en el camino de la petición del usuario.</text>
  <text x="45" y="714" font-size="10.5" fill="#334155">→ trazo punteado: consulta a un modelo (LLM) — solo ocurre si el paso anterior lo requiere, nunca es obligatoria.</text>
  <text x="45" y="730" font-size="10.5" fill="#334155">Recuadro punteado: agrupa piezas del mismo proceso Node (backend) o de la misma capa (almacenamiento) — no son servicios separados.</text>
</svg>
